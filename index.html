<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盆踊り、民謡流し情報</title>
  <meta name="description" content="盆踊り・民謡流しの日程と場所、セットリストの地図。まず新潟県から。">
  <!-- 近いピンを数字の丸にまとめる部品（Google マップ公式） -->
  <script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>
  <style>
    :root { --bg: #fff; --fg: #222; --sub: #666; --line: #ddd; --accent: #b03a2e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #eee; --sub: #aaa; --line: #333; --accent: #e07a6e; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 18px; margin: 0; }
    select, input { font-size: 15px; padding: 4px 8px; max-width: 100%; }
    #q { width: 220px; }
    #count { color: var(--sub); font-size: 13px; }
    main { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; }
    #list { width: 320px; overflow-y: auto; border-left: 1px solid var(--line); margin: 0; padding: 0; list-style: none; }
    #list li { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
    #list li:hover { background: rgba(127,127,127,.1); }
    #list li { padding: 7px 16px; }
    #list .l1 { display: flex; gap: 8px; align-items: baseline; }
    #list .d { font-size: 13px; color: var(--accent); flex: none; font-weight: bold; }
    #list .n { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #list .p { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #list li.sec { cursor: default; font-size: 12px; font-weight: bold; color: var(--sub); background: rgba(127,127,127,.08); padding: 4px 16px; }
    #list li.sec:hover { background: rgba(127,127,127,.08); }
    #list li.past { opacity: .55; }
    #list .p .stat { margin: 0 6px 0 0; }
    .cluster { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #b03a2e; color: #fff; font-weight: bold; font-size: 13px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); cursor: pointer; }
    #empty { padding: 16px; color: var(--sub); font-size: 14px; cursor: default; }
    @media (max-width: 700px) {
      main { flex-direction: column; }
      #map { min-height: 55vh; }
      #list { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
    }
    /* 吹き出し（Google マップの InfoWindow の中身。地図の上なので常に明るい色） */
    .pop { font-size: 13px; line-height: 1.6; color: #222; max-width: 290px; }
    .pop b { font-size: 15px; }
    .pop .venue { font-weight: bold; }
    .pop .time { border-top: 1px solid #eee; margin-top: 6px; padding-top: 6px; }
    .pop .when { color: #b03a2e; font-weight: bold; }
    .pop .songs { margin: 4px 0; padding-left: 1.4em; }
    .pop .cmt { white-space: pre-wrap; margin: 4px 0; }
    .pop .sub { color: #666; font-size: 12px; }
    .stat { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 3px; background: #555; color: #fff; font-size: 12px; font-weight: bold; }
    .pop .off .when { text-decoration: line-through; opacity: .6; }
    .pop .no { color: #888; font-size: 11px; margin-left: 4px; }
    #newsBtn { font-size: 14px; padding: 4px 10px; }
    #news { width: min(640px, calc(100vw - 32px)); max-height: 80vh; overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--bg); color: var(--fg); }
    #news::backdrop { background: rgba(0,0,0,.4); }
    #news .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
    #news .head h2 { font-size: 16px; margin: 0; flex: 1; min-width: 10em; }
    #news .tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; width: 100%; font-size: 13px; }
    #news ul { list-style: none; margin: 0; padding: 0; }
    #news li { display: flex; gap: 10px; padding: 6px 16px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
    #news li > span:last-child { min-width: 0; overflow-wrap: anywhere; }
    #news .at { color: var(--sub); font-size: 12px; flex: none; width: 3.2em; padding-top: 2px; }
    #news .key { font-weight: bold; }
    #news .note { color: var(--sub); font-size: 12px; padding: 8px 16px; margin: 0; }
    #newsMore { display: block; margin: 10px auto 14px; font-size: 14px; padding: 4px 16px; }
    #newsMore[hidden] { display: none; }
    .pin { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>盆踊り、民謡流し情報</h1>
    <select id="region" aria-label="地域"></select>
    <select id="year" aria-label="年"></select>
    <select id="song" aria-label="曲"></select>
    <input id="q" type="search" placeholder="名前・地名・曲名で探す（ひらがな可）" aria-label="探す">
    <span id="count">読み込み中…</span>
    <button id="newsBtn" type="button">お知らせ・更新履歴</button>
  </header>
  <dialog id="news" aria-labelledby="newsTitle">
    <div class="head"><h2 id="newsTitle">お知らせ・更新履歴</h2>
      <button id="newsClose" type="button">閉じる</button>
      <div class="tools">
        <label><input id="newsAll" type="checkbox"> 掲載・更新もすべて表示</label>
        <input id="newsQ" type="search" placeholder="番号（C0001 など）で探す" aria-label="番号で探す">
      </div></div>
    <p class="note" id="newsNote"></p>
    <ul id="newsList"></ul>
    <button id="newsMore" type="button" hidden>もっと見る</button>
  </dialog>
  <main>
    <div id="map"></div>
    <ul id="list"></ul>
  </main>

  <script>
    // 設定。地図のデータはスプレッドシート（Apps Script の ?format=json）から毎回読む
    const DATA_URL = 'https://script.google.com/macros/s/AKfycbyY3-EEqumnL44_i4nZ5XQrvUSBpWZtWadCpmKMAF9sXaRvMTy55PNorHDEwU9l8xXR7A/exec?format=json';
    // Google マップのキー（このサイト〈mamecoro-droid.github.io〉でだけ使えるよう Google Cloud で制限してある）とマップID
    const MAPS_KEY = 'AIzaSyAHAkcpmeySq2kS8S2GEiAFkSI7TzkL_fU';
    const MAP_ID = '854cacd97c179959c6edbae5';

    // Google マップの読み込み（Google の公式の読み込み方）
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: MAPS_KEY, v: 'weekly', language: 'ja', region: 'JP',
    });

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hira = (s) => String(s).replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s/g, '').toLowerCase();
    const md = (s) => Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10));
    const hours = (t) => (t.startTime || t.endTime ? ' ' + (t.startTime || '') + '〜' + (t.endTime || '') : '');
    const period = (t) => t.year + '年 ' + md(t.start) + (t.end && t.end !== t.start ? '〜' + md(t.end) : '') + hours(t);
    // 中止・延期の印（「中止（10/20 更新）」）と、最終更新
    // 「2026-12-01」「2026/12/1」は「12/1」に。ほかの書き方はそのまま
    const ymdOrText = (s) => String(s).replace(/^\d{4}[-\/](\d{1,2})[-\/](\d{1,2})/, (_, m, d) => Number(m) + '/' + Number(d));
    const stat = (t) => {
      if (!t.status) return '';
      const notes = [];
      if (t.status === '延期') notes.push(t.postponedTo ? '→ ' + ymdOrText(t.postponedTo) : '日程未定');
      if (t.statusAt) notes.push(md(t.statusAt) + ' 更新');
      return `<span class="stat">${esc(t.status + (notes.length ? '（' + notes.join('・') + '）' : ''))}</span>`;
    };
    const updated = (t) => (t.updated ? `<span class="sub">最終更新 ${esc(md(t.updated))}</span><br>` : '');
    const place = (e) => [e.pref, e.city, e.area + (e.area && e.areaYomi ? '（' + e.areaYomi + '）' : '')].filter(Boolean).join(' ');
    const link = (u, text) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(text)}</a>`;

    // ピン（しずく形。先端が場所を指す）
    function pinEl() {
      const d = document.createElement('div');
      d.innerHTML = '<svg class="pin" width="30" height="42" viewBox="-1 -1 30 42"><path d="M14 0C6.3 0 0 6.2 0 13.9 0 24.3 14 40 14 40s14-15.7 14-26.1C28 6.2 21.7 0 14 0z" fill="#b03a2e" stroke="#fff" stroke-width="2"/><circle cx="14" cy="14" r="5" fill="#fff"/></svg>';
      return d.firstChild;
    }

    // Google マップで開く: 会場名があれば名前で探す（場所の名前が出る）。なければ座標で開く
    function gmapsUrl(e) {
      const q = e.venue ? [e.venue, e.pref + e.city].filter(Boolean).join(' ') : e.lat + ',' + e.lng;
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    }

    function popup(e, times) {
      return `<div class="pop"><b>${esc(e.name)}</b><br>` + (e.venue ? `<span class="venue">${esc(e.venue)}</span><br>` : '') + `<span class="sub">${esc(place(e))}</span>` +
        (e.urls.length ? '<br>' + e.urls.map((u, i) => link(u, '関連HP' + (e.urls.length > 1 ? i + 1 : ''))).join(' ・ ') : '') +
        `<br>${link(gmapsUrl(e), 'Google マップで開く')}` +
        times.map((t) => `<div class="time${t.status === '中止' ? ' off' : ''}"><span class="when">${esc(period(t))}</span>${stat(t)}` +
          (t.songs.length ? '<ol class="songs">' + t.songs.map((s) =>
            `<li>${esc(s.name)}${s.dance ? ' <span class="sub">（' + esc(s.dance) + '）</span>' : ''}${s.video ? ' ' + link(s.video, '動画') : ''}</li>`).join('') + '</ol>' : '') +
          (t.comment ? `<div class="cmt">${esc(t.comment)}</div>` : '') +
          (t.urls.length ? t.urls.map((u, i) => link(u, '情報元' + (t.urls.length > 1 ? i + 1 : ''))).join(' ・ ') + '<br>' : '') +
          (t.provider ? `<span class="sub">情報提供: ${esc(t.provider)}</span><br>` : '') +
          updated(t) +
          (t.id ? `<span class="sub">番号 ${esc(t.id)}</span>` : '') +
          '</div>').join('') + '</div>';
    }

    async function start() {
      const countEl = document.getElementById('count');
      let DATA;
      try {
        const res = await fetch(DATA_URL);
        DATA = await res.json();
      } catch (err) {
        countEl.textContent = '情報を読み込めませんでした。時間をおいて再読み込みしてください。';
        return;
      }
      setupNews(DATA.history || []);
      const { Map, InfoWindow } = await google.maps.importLibrary('maps');
      const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');
      const { LatLngBounds } = await google.maps.importLibrary('core');

      const map = new Map(document.getElementById('map'), {
        center: { lat: 37.5, lng: 138.8 }, zoom: 8, mapId: MAP_ID, // 新潟県あたり
        gestureHandling: 'greedy', streetViewControl: true, mapTypeControl: true, fullscreenControl: true,
      });
      const info = new InfoWindow();
      let markers = [];
      // 近いピンは「12」のような丸にまとめる。押すとそこを拡大して、ピンに分かれる
      const clusterer = new markerClusterer.MarkerClusterer({
        map,
        renderer: {
          render: ({ count, position }) => {
            const d = document.createElement('div');
            const size = count < 10 ? 34 : count < 100 ? 40 : 48;
            d.className = 'cluster';
            d.style.width = d.style.height = size + 'px';
            d.textContent = count;
            return new AdvancedMarkerElement({ position, content: d, title: count + '件', zIndex: 1000 + count });
          },
        },
      });
      // 今日（日本時間）。これより前に終わった回は「終わった回」
      const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
      const isPast = (t) => (t.end || t.start) < today;

      const regionSel = document.getElementById('region');
      const yearSel = document.getElementById('year');
      const songSel = document.getElementById('song');
      const q = document.getElementById('q');
      regionSel.innerHTML = Object.keys(DATA.regions).map((r) => `<option>${esc(r)}</option>`).join('');
      regionSel.value = DATA.defaultRegion;
      // 最初は「すべての年」。これからの回が上に並ぶので、今年の残りと来年の予定が一度に見える
      yearSel.innerHTML = '<option value="">すべての年</option>' + DATA.years.map((y) => `<option value="${y}">${y}年</option>`).join('');
      yearSel.value = '';

      const inRegion = (e) => !DATA.regions[regionSel.value] || DATA.regions[regionSel.value].includes(e.pref);
      const timesOf = (e) => e.times.filter((t) => !yearSel.value || String(t.year) === yearSel.value);

      // 曲の一覧: 今の地域・年のセットリストに出てくる曲（辞書で決まった曲だけ）。多い順
      function fillSongs() {
        const keep = songSel.value;
        const count = {};
        DATA.events.filter(inRegion).forEach((e) => timesOf(e).forEach((t) => t.songs.forEach((s) => {
          if (!s.id) return;
          count[s.id] = count[s.id] || { name: s.name, yomi: s.yomi || s.name, n: 0 };
          count[s.id].n++;
        })));
        const ids = Object.keys(count).sort((a, b) => count[b].n - count[a].n || count[a].yomi.localeCompare(count[b].yomi, 'ja'));
        songSel.innerHTML = '<option value="">すべての曲</option>' +
          ids.map((id) => `<option value="${esc(id)}">${esc(count[id].name)}（${count[id].n}）</option>`).join('');
        songSel.value = ids.includes(keep) ? keep : '';
      }

      // ピンから開くときはピンに付ける。一覧から開くときは、ピンが丸にまとまっていることがあるので場所で開く
      function open(it, fromList) {
        info.setContent(popup(it.e, it.times));
        if (fromList) {
          info.setOptions({ position: { lat: it.e.lat, lng: it.e.lng }, pixelOffset: new google.maps.Size(0, -40) });
          info.open({ map });
        } else {
          info.setOptions({ pixelOffset: null });
          info.open({ anchor: it.m, map });
        }
      }

      function render() {
        clusterer.clearMarkers();
        markers = [];
        info.close();
        const key = hira(q.value);
        const items = [];
        for (const e of DATA.events) {
          if (!inRegion(e)) continue;
          let times = timesOf(e);
          if (songSel.value) times = times.filter((t) => t.songs.some((s) => s.id === songSel.value));
          if (!times.length) continue;
          if (key) {
            const text = [e.name, e.venue, e.pref, e.city, e.area, e.areaYomi].concat(...times.map((t) => t.songs.map((s) => s.name + s.yomi))).join(' ');
            if (!hira(text).includes(key)) continue;
          }
          const m = new AdvancedMarkerElement({ position: { lat: e.lat, lng: e.lng }, content: pinEl(), title: e.name, gmpClickable: true });
          // 一覧に出す回: これからの回があればいちばん近いもの、なければいちばん新しい回
          const next = times.filter((t) => !isPast(t)).sort((a, b) => a.start.localeCompare(b.start))[0];
          const it = { e, times, latest: next || times[0], m };
          it.past = !next;
          m.addEventListener('gmp-click', () => open(it));
          markers.push(m);
          items.push(it);
        }
        clusterer.addMarkers(markers);
        // 一覧: これからの回（日にちの近い順）を上に、終わった回（新しい順）を下にまとめて薄く
        const coming = items.filter((it) => !it.past).sort((a, b) => a.latest.start.localeCompare(b.latest.start) || a.e.name.localeCompare(b.e.name, 'ja'));
        const past = items.filter((it) => it.past).sort((a, b) => b.latest.start.localeCompare(a.latest.start) || a.e.name.localeCompare(b.e.name, 'ja'));
        const ordered = coming.concat(past);
        // 1行目に日にちと名前、2行目に場所。年をまたいで見ているとき（すべての年）は年も付ける
        const shortDate = (t) => (yearSel.value ? '' : t.year + '/') + md(t.start) + (t.end && t.end !== t.start ? '〜' + md(t.end) : '');
        const row = (it) => `<li data-i="${ordered.indexOf(it)}"${it.past ? ' class="past"' : ''}>` +
          `<div class="l1"><span class="d">${esc(shortDate(it.latest))}</span><span class="n">${esc(it.e.name)}</span></div>` +
          `<div class="p">${stat(it.latest)}${esc([it.e.venue, place(it.e)].filter(Boolean).join('・'))}</div></li>`;
        const list = document.getElementById('list');
        list.innerHTML = items.length
          ? (coming.length && past.length ? '<li class="sec">これから</li>' : '') + coming.map(row).join('') +
            (past.length ? '<li class="sec">終わった回</li>' + past.map(row).join('') : '')
          : '<li id="empty">' + (DATA.events.length ? '当てはまる情報がありません。' : 'まだ情報が登録されていません。') + '</li>';
        list.querySelectorAll('li[data-i]').forEach((li) => li.addEventListener('click', () => {
          const it = ordered[li.dataset.i];
          map.panTo({ lat: it.e.lat, lng: it.e.lng });
          map.setZoom(15);
          open(it, true);
        }));
        countEl.textContent = items.length + '件';
        if (items.length === 1) { map.setCenter({ lat: items[0].e.lat, lng: items[0].e.lng }); map.setZoom(13); }
        else if (items.length) {
          const b = new LatLngBounds();
          items.forEach((it) => b.extend({ lat: it.e.lat, lng: it.e.lng }));
          map.fitBounds(b, 60);
        }
      }

      regionSel.addEventListener('change', () => { fillSongs(); render(); });
      yearSel.addEventListener('change', () => { fillSongs(); render(); });
      songSel.addEventListener('change', render);
      q.addEventListener('input', render);
      fillSongs();
      render();
    }

    // お知らせ・更新履歴（地図のデータと一緒に届く）
    // お知らせ・更新履歴（地図のデータと一緒に届く）。
    // 最初は中止・延期・取り下げなど大事なものだけ。「すべて表示」で掲載・更新も。30件ずつ出す
    const NEWS_KEY = ['中止', '延期', '予定どおり', '取り下げ', '再掲載', '削除'];
    const NEWS_STEP = 30;
    function setupNews(history) {
      const dlg = document.getElementById('news');
      const listEl = document.getElementById('newsList');
      const qEl = document.getElementById('newsQ');
      const allEl = document.getElementById('newsAll');
      const moreEl = document.getElementById('newsMore');
      const noteEl = document.getElementById('newsNote');
      let limit = NEWS_STEP;
      const draw = () => {
        const key = qEl.value.trim().toUpperCase();
        // 番号で探すときは種類で絞らない（その番号に起きたことを全部見せる）
        const rows = history.filter((h) => (key ? h.ref.toUpperCase().includes(key) || h.text.toUpperCase().includes(key) : allEl.checked || NEWS_KEY.includes(h.what)));
        noteEl.textContent = key ? '「' + qEl.value.trim() + '」のお知らせ（' + rows.length + '件）'
          : allEl.checked ? '掲載・更新・中止・延期・取り下げを、新しい順に載せています（' + rows.length + '件）。'
          : '中止・延期・取り下げなどを、新しい順に載せています（' + rows.length + '件）。番号は地図の吹き出しにある「番号」です。';
        listEl.innerHTML = rows.length
          ? rows.slice(0, limit).map((h) => `<li><span class="at">${esc(md(h.at))}</span><span${NEWS_KEY.includes(h.what) ? ' class="key"' : ''}>${esc(h.text)}</span></li>`).join('')
          : '<li>' + (key ? '当てはまるお知らせがありません。' : 'まだお知らせはありません。') + '</li>';
        moreEl.hidden = rows.length <= limit;
      };
      const reset = () => { limit = NEWS_STEP; draw(); };
      qEl.addEventListener('input', reset);
      allEl.addEventListener('change', reset);
      moreEl.addEventListener('click', () => { limit += NEWS_STEP; draw(); });
      document.getElementById('newsBtn').addEventListener('click', () => { reset(); dlg.showModal(); });
      document.getElementById('newsClose').addEventListener('click', () => dlg.close());
    }

    start();
  </script>
</body>
</html>
